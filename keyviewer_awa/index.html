                        next.inputMode +
                        '|' +
                        next.gameSlots +
                        '|' +
                        next.showInputStatus +
                        '|' +
                        next.gameSocket;
                    var firstApply = lastInputSignature === null;
                    if (inputSignature !== lastInputSignature) {
                        lastInputSignature = inputSignature;
                        keyboardProbeDone = false;
                        if (probeTimer) {
                            clearTimeout(probeTimer);
                            probeTimer = null;
                        }
                        releaseAll();
                        if (next.inputMode === 'keyboard') {
                            disconnectGameSocket();
                            setActiveSource(KEYBOARD_SOURCE);
                        } else if (next.inputMode === 'game') {
                            setActiveSource(GAME_SOURCE);
                        } else if (!keyboardSeen) {
                            setActiveSource(GAME_SOURCE);
                        } else {
                            setActiveSource(KEYBOARD_SOURCE);
                        }
                        /* input related settings changed: restart the source machinery
                           with the freshly loaded configuration */
                        if (!firstApply || !inputStarted) {
                            startInput();
                            inputStarted = true;
                        }
                    }

                    /* Apply the new look right now, synchronously. Going through the
                       animation-frame queue was fragile: the page may never paint (OBS
                       preview, background tab) and an unrelated frame update could
                       consume the pending rebuild before the new view was in place.
                       Rebuilding here removes both failure modes. */
                    needsRebuild = false;
                    frameQueued = false;
                    rebuildCount++;
                    rebuild();

                    /* the "only while playing" switch may have been toggled */
                    updateVisibility();

                    /* open or close the state stream to match that switch */
                    connectStateSocket();
                }

                /* Overlay settings live in <counter folder>/settings.json (this file,
                   read back for defaults) and in <tosu>/settings/<folder>.values.json
                   (what the Dashboard writes). The overlay cannot delete the values
                   file, but it can write an empty object back through the same API the
                   Dashboard uses, which restores every "default" value. */
                var RESET_VALUE_KEY = '__reset';
                var lastResetToken = null;
                var resetInFlight = false;
                var settingsSocket = null;
                var settingsSocketTimer = null;
                var settingsRetry = 0;
                /* the last settings.json payload, so a broadcast can be merged
                   against the same defaults without another HTTP round trip */
                var lastLoadedJson = null;
                /* What the Dashboard currently holds. tosu sends this as a full set
                   (getSettings reply) or as only the changed keys (updateSettings
                   broadcast), so it lives here and is merged, never replaced by a
                   partial payload. */
                var dashboardValues = {};
                /* true once a COMPLETE set is known (boot read or getSettings
                   reply). Until then a partial update cannot be applied safely. */
                var settingsEverAppliedFromDashboard = false;
                /* the last fully applied setting set: the fallback layer so a partial
                   update cannot silently reset everything else */
                var lastGoodSettings = null;

                function settingsFolderUrl() {
                    var path = window.location.pathname || '/';
                    if (path.charAt(path.length - 1) === '/') {
                        return path;
                    }
                    var slash = path.lastIndexOf('/');
                    if (slash === -1) return '/';
                    return path.slice(0, slash + 1);
                }

                /* The counter folder name, which is how tosu identifies this overlay
                   on its settings channel. Both URL forms must work:
                     /keyviewer_awa/             (the usual OBS URL)
                     /keyviewer_awa/index.html   (explicit file, dashboard preview) */
                function counterFolderName() {
                    var path = window.location.pathname || '';
                    var parts = path.split('/').filter(function (part) {
                        return part !== '';
                    });

                    for (var i = parts.length - 1; i >= 0; i--) {
                        var part = parts[i];
                        if (/\.html?$/i.test(part)) continue;
                        return decodeURIComponent(part);
                    }
                    return '';
                }

                function readResetToken(json) {
                    if (!json) return null;
                    if (json.resetSettings === true || json.resetSettings === 'true') {
                        return 'plain';
                    }
                    var token = json.resetSettings;
                    if (typeof token === 'string' && token.trim()) return token.trim();
                    return null;
                }

                function clearStoredValues() {
                    var folder = counterFolderName();
                    if (!folder || resetInFlight) return;

                    resetInFlight = true;
                    fetch('/api/counters/settings/' + encodeURIComponent(folder), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify([
                            { uniqueID: RESET_VALUE_KEY, value: '' }
                        ])
                    })
                        .then(function (response) {
                            return response.json();
                        })
                        .then(function (result) {
                            log('settings reset', result);
                        })
                        .catch(function (error) {
                            log('settings reset failed', error && error.message);
                        })
                        .then(function () {
                            resetInFlight = false;
                        });
                }

                function installErrorTrap() {
                    window.addEventListener('error', function (event) {
                        lastSettingsError = 'js: ' + (event.message || 'error');
                        log('window error', event.message);
                    });
                    window.addEventListener('unhandledrejection', function (event) {
                        var reason = event && event.reason;
                        lastSettingsError =
                            'promise: ' + ((reason && reason.message) || reason);
                        log('unhandled rejection', lastSettingsError);
                    });
                }

                /* The Dashboard does NOT rewrite this folder's settings.json. It saves
                   what the user entered into <tosu>/settings/<folder>.values.json and
                   exposes it through /api/counters/settings/<folder> as
                   { settings: [...definitions], values: {...saved values} }.

                   Reading that endpoint on a timer is what used to flood the tosu log
                   with "Settings accessed" lines and add constant work to the server,
                   which is also what slowed other overlays down until they missed
                   game-state changes. Instead the overlay joins tosu's own settings
                   broadcast:

                     - sends   getSettings:<folder>       on /websocket/commands
                     - tosu    replies with the saved values
                     - on every Dashboard save, tosu emits
                       "save settings" to the same channel, and we re-read once

                   So settings are read at boot and whenever they actually change -
                   never on a timer. */

                function settingsChannelUrl() {
                    var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                    var path = settingsFolderUrl();
                    var folder = counterFolderName();
                    return (
                        protocol +
                        window.location.host +
                        '/websocket/commands?l=' +
                        encodeURIComponent(folder || path)
                    );
                }

                /* tosu broadcasts the save on the commands channel as
                   "updateSettings" with only the changed keys, so a plain text
                   notice is no longer needed. Kept for the getSettings reply path. */
                function isOwnSaveNotice(raw) {
                    return raw.indexOf('saveSettings') === 0 || raw.indexOf('save settings') === 0;
                }

                /* Ask tosu for the complete saved setting set. */
                function requestSettings() {
                    if (!settingsSocket || settingsSocket.readyState !== 1) return;
                    try {
                        settingsSocket.send(
                            'getSettings:' + encodeURIComponent(counterFolderName())
                        );
                    } catch (error) {
                        log('getSettings failed', error && error.message);
                    }
                }

                function connectSettingsSocket() {
                    if (typeof window.WebSocket !== 'function') return;

                    try {
                        settingsSocket = new window.WebSocket(settingsChannelUrl());
                    } catch (error) {
                        log('settings socket failed', error && error.message);
                        scheduleSettingsReconnect();
                        return;
                    }

                    settingsSocket.onopen = function () {
                        settingsRetry = 0;
                        requestSettings();
                    };

                    settingsSocket.onmessage = function (event) {
                        var raw = String(event.data || '');

                        var data;
                        try {
                            data = JSON.parse(raw);
                        } catch (error) {
                            data = null;
                        }

                        if (data) {
                            /* tosu replies to getSettings with the complete saved set */
                            if (data.command === 'getSettings') {
                                if (!data.message || data.message.error) return;
                                if (
                                    typeof data.message !== 'object' ||
                                    Array.isArray(data.message)
                                ) {
                                    return;
                                }

                                dashboardValues = data.message;
                                if (Object.keys(dashboardValues).length === 0) return;

                                settingsEverAppliedFromDashboard = true;
                                settingsSource =
                                    'tosu values(' +
                                    Object.keys(dashboardValues).length +
                                    ')';
                                applySettings(lastLoadedJson);
                                return;
                            }

                            /* after a Dashboard save tosu broadcasts ONLY the keys
                               that changed. They have to be merged into what we
                               already know, otherwise every other setting falls back
                               to the plugin defaults. */
                            if (data.command === 'updateSettings') {
                                var changed = parseChangedValues(data.message);
                                if (!changed) return;

                                /* A partial update is only safe on top of a complete
                                   set. If none is known yet, ask for the full one. */
                                if (!settingsEverAppliedFromDashboard) {
                                    requestSettings();
                                    return;
                                }

                                mergeInto(dashboardValues, changed);
                                settingsSource =
                                    'tosu update(' + Object.keys(changed).length + ')';
                                applySettings(lastLoadedJson);
                                return;
                            }
                        }

                        /* the plain-text fallbacks (older/other tosu builds) */
                        if (raw.indexOf('saveSettings') === 0 || raw.indexOf('save settings') === 0) {
                            loadSettingsOnce();
                            return;
                        }

                        log('settings channel message', raw.slice(0, 200));
                    };

                    settingsSocket.onclose = function () {
                        settingsSocket = null;
                        scheduleSettingsReconnect();
                    };

                    settingsSocket.onerror = function () {
                        /* onclose follows */
                    };
                }

                /* updateSettings carries [{uniqueID, value}, ...] */
                function parseChangedValues(message) {
                    if (!message) return null;

                    var list = Array.isArray(message) ? message : null;
                    if (!list && typeof message === 'string') {
                        try {
                            var parsed = JSON.parse(message);
                            list = Array.isArray(parsed) ? parsed : null;
                        } catch (error) {
                            return null;
                        }
                    }
                    if (!list) return null;

                    var out = {};
                    var count = 0;
                    for (var i = 0; i < list.length; i++) {
                        var entry = list[i];
                        if (!entry || typeof entry !== 'object') continue;
                        var id = String(entry.uniqueID || '').replace(/[^a-z0-9]/gim, '');
                        if (!id) continue;
                        out[id] = entry.value;
                        count++;
                    }
                    return count ? out : null;
                }

                /* Shallow merge. Never hand a partial set to applySettings on its
                   own: normalize() falls back to settings.json for anything it
                   cannot see, which would revert every untouched setting. */
                function mergeInto(target, source) {
                    if (!source) return target;
                    Object.keys(source).forEach(function (key) {
                        target[key] = source[key];
                    });
                    return target;
                }

                function scheduleSettingsReconnect() {
                    if (settingsSocketTimer) return;
                    settingsRetry++;
                    settingsSocketTimer = setTimeout(function () {
                        settingsSocketTimer = null;
                        connectSettingsSocket();
                    }, Math.min(10000, 500 * settingsRetry));
                }

                function settingsApiUrl() {
                    return '/api/counters/settings/' + encodeURIComponent(counterFolderName());
                }

                function fetchDashboardSettings() {
                    return fetch(settingsApiUrl(), { cache: 'no-store' }).then(
                        function (response) {
                            if (!response.ok) throw new Error('HTTP ' + response.status);
                            return response.json();
                        }
                    );
                }

                function hasDashboardValues(payload) {
                    if (!payload || payload.error) return false;
                    if (!Array.isArray(payload.settings)) return false;
                    var values = payload.values;
                    if (!values || typeof values !== 'object' || Array.isArray(values)) {
                        return false;
                    }
                    return Object.keys(values).length > 0;
                }

                function loadSettingsOnce() {
                    var reloadUrl = settingsFolderUrl() + 'settings.json';
                    var url = reloadUrl + '?t=' + Date.now();
                    lastSettingsUrl = url;
                    settingsFetchState = 'started#' + (++settingsFetchCount);

                    function retryWithConcreteUrl() {
                        /* serving a folder URL can behave differently across hosts;
                           settings.json is a sibling of index.html in both cases, but
                           fall back to the resolved URL once just to be safe */
                        var absolute = new URL('settings.json', window.location.href);
                        absolute.searchParams.set('t', String(Date.now()));
                        lastSettingsUrl = absolute.pathname + absolute.search;

                        return fetch(absolute.toString(), { cache: 'no-store' }).then(
                            function (response) {
                                if (!response.ok) throw new Error('HTTP ' + response.status);
                                return response.json();
                            }
                        );
                    }

                    /* settings.json holds the plugin's own defaults, while the tosu API
                       holds whatever the user saved in the Dashboard. Values win. */
                    return fetch(url, { cache: 'no-store' })
                        .then(function (response) {
                            if (!response.ok) throw new Error('HTTP ' + response.status);
                            return response.json();
                        })
                        .catch(function (error) {
                            log('settings.json retry after', error && error.message);
                            return retryWithConcreteUrl();
                        })
                        .then(function (json) {
                            /* record that the file arrived BEFORE touching anything
                               else, so a later exception cannot look like "no
                               settings" and silently force the defaults */
                            lastSettingsError = '';
                            settingsSource = Array.isArray(json)
                                ? 'array(' + json.length + ')'
                                : 'object(' +
                                  (json && typeof json === 'object'
                                      ? Object.keys(json).length
                                      : typeof json) +
                                  ')';

                            var token = readResetToken(json);
                            if (token && token !== lastResetToken) {
                                lastResetToken = token;
                                clearStoredValues();
                            } else if (token) {
                                lastResetToken = token;
                            } else {
                                lastResetToken = null;
                            }

                            return fetchDashboardSettings()
                                .then(function (payload) {
                                    lastLoadedJson = json;
                                    if (hasDashboardValues(payload)) {
                                        /* Merge backwards: anything a broadcast has
                                           already delivered is NEWER than this
                                           snapshot, so it must not be rolled back by
                                           a slow boot-time read. */
                                        if (!settingsEverAppliedFromDashboard) {
                                            mergeInto(dashboardValues, payload.values);
                                        }
                                        settingsEverAppliedFromDashboard = true;
                                        settingsSource =
                                            'tosu values(' +
                                            Object.keys(payload.values).length +
                                            ') + ' +
                                            settingsSource;
                                    }
                                    applySettings(json);
                                })
                                .catch(function (error) {
                                    /* bare preview server or file access: the plugin's
                                       own defaults file is still enough */
                                    log(
                                        'dashboard settings API unavailable',
                                        error && error.message
                                    );
                                    lastLoadedJson = json;
                                    applySettings(json);
                                });
                        })
                        .then(function () {
                            settingsFetchState = 'applied#' + ++settingsFetchCount;
                            return true;
                        })
                        .catch(function (error) {
                            lastSettingsError =
                                'fetch: ' + ((error && error.message) || 'unknown error');
                            settingsFetchState = 'failed#' + ++settingsFetchCount;
                            log('settings.json fetch failed', lastSettingsError);
                            if (!settingsLoaded) applySettings({});
                            return false;
                        });
                }

                /* ?config={"rainMode":"blocks",...} on the overlay URL forces
                   specific values, which keeps previews and automated tests
                   deterministic - and is the supported way to reach the
                   behaviours whose Dashboard options were removed. */
                function readUrlOverride() {
                    var params = new URLSearchParams(window.location.search || '');
                    var raw = params.get('config');
                    if (!raw) return null;

                    try {
                        var override = JSON.parse(raw);
                        if (!override || typeof override !== 'object') return null;
                        if (Array.isArray(override)) return null;
                        return override;
                    } catch (error) {
                        log('bad ?config payload', error && error.message);
                        return null;
                    }
                }

                var urlOverrideInjected = null;

                function currentUrlOverride() {
                    var fromUrl = readUrlOverride();
                    if (fromUrl) return fromUrl;
                    return urlOverrideInjected;
                }

                /* ------------------------------------------------------------------ *
                 * 11. Boot
                 * ------------------------------------------------------------------ */
                function boot() {
                    hostEl = document.getElementById('overlay_host');
                    rainCanvas = document.getElementById('rain_canvas');
                    squaresEl = document.getElementById('key_squares');

                    if (!hostEl || !rainCanvas || !squaresEl || !rainCanvas.getContext) {
                        return;
                    }

                    rootEl = hostEl;
                    rainCtx = rainCanvas.getContext('2d');

                    /* a detached canvas is used purely to measure label widths */
                    try {
                        var measureCanvas = document.createElement('canvas');
                        measureCtx = measureCanvas.getContext('2d');
                    } catch (error) {
                        measureCtx = rainCtx;
                    }

                    if (new URLSearchParams(window.location.search || '').has('debug')) {
                        debugEl = document.createElement('div');
                        debugEl.style.cssText =
                            'position:fixed;left:4px;top:4px;z-index:9;padding:2px 6px;' +
                            'font:11px/1.4 Consolas,monospace;color:#0f0;' +
                            'background:rgba(0,0,0,.55);border-radius:4px;pointer-events:none';
                        document.body.appendChild(debugEl);
                    }

                    /* the input-source badge: this is what tells the user why a
                       setup shows nothing when they press a key */
                    statusEl = document.createElement('div');
                    statusEl.style.cssText =
                        'position:fixed;left:0;bottom:0;z-index:9;padding:1px 5px;' +
                        'font:10px/1.5 Consolas,monospace;color:#0ff;' +
                        'background:rgba(0,0,0,.55);border-radius:3px;pointer-events:none;' +
                        'display:none';
                    document.body.appendChild(statusEl);

                    view = normalize({});
                    settings = view;

                    buildKeys();
                    computeLayout();
                    resizeCanvas();
                    applyStyles();
                    watchResize();
                    bindInput();
                    installErrorTrap();
                    /* The input machinery is started from applySettings once the real
                       configuration has been read, so the keyboard-detection window
                       never runs against hardcoded defaults. This is only a safety
                       net for the case where settings.json cannot be read at all. */
                    setTimeout(ensureInputStarted, 2500);

                    loadSettingsOnce();
                    connectSettingsSocket();

                    lastFrame = 0;
                    rafId = requestAnimationFrame(loop);

                    /* expose a tiny hook so a preview page or an automated test can
                       drive the overlay without a real keyboard */
                    window.keyviewer = {
                        press: function (code) {
                            var resolved = resolveCode(code);
                            if (resolved) setPressed(resolved, true);
                            return resolved;
                        },
                        release: function (code) {
                            var resolved = resolveCode(code);
                            if (resolved) setPressed(resolved, false);
                            return resolved;
                        },
                        releaseAll: releaseAll,
                        applySettings: applySettings,
                        /* Feeds settings the way the Dashboard does, so a test
                           exercises the real path instead of poking locals.
                             setDashboardValues(partial) -> merge + apply, exactly like
                             the updateSettings broadcast
                             setDashboardValues(full, true) -> replace, exactly like the
                             getSettings reply */
                        setDashboardValues: function (values, replace) {
                            if (!values) return;
                            if (replace) {
                                dashboardValues = values;
                                settingsEverAppliedFromDashboard = true;
                            } else {
                                mergeInto(dashboardValues, values);
                            }
                            settingsSource = replace
                                ? 'tosu values(' + Object.keys(dashboardValues).length + ')'
                                : 'tosu update(' + Object.keys(values).length + ')';
                            applySettings(lastLoadedJson);
                        },
                        /* Deterministic driver for tests and previews: advances the
                           rain by an exact amount and repaints. Headless browsers
                           throttle requestAnimationFrame, so without this there is
                           no way to assert on rain motion. */
                        step: function (seconds) {
                            var total = typeof seconds === 'number' ? seconds : 1 / 60;
                            var slice = 1 / 120;
                            if (total < slice) slice = total;
                            for (var elapsed = 0; elapsed < total; elapsed += slice) {
                                updateRain(Math.min(slice, total - elapsed));
                            }
                            drawRain();
                            if (debugEl) updateDebugText();
                            return rain.length;
                        },
                        /* why the rain is (not) moving - for tests and support */
                        debugRain: function () {
                            var pressed = [];
                            for (var i = 0; i < keys.length; i++) {
                                pressed.push(
                                    (keys[i].code || '?') + '=' + (keys[i].pressed ? '1' : '0')
                                );
                            }
                            return {
                                rainMode: view.rainMode,
                                speed: view.rainFlowSpeed,
                                barLength: rainBarLength(),
                                rainHeight: layout.rainHeight,
                                square: layout.square,
                                keys: pressed.join(' '),
                                pieces: rain.length
                            };
                        },
                        /* internal piece list, so a test can assert on geometry */
                        rainState: function () {
                            return rain.map(function (piece) {
                                return {
                                    key: piece.key,
                                    yBottom: piece.yBottom,
                                    height: piece.height,
                                    growing: piece.growing,
                                    fade: piece.fade
                                };
                            });
                        },
                        /* drives the game-data source without osu!/tosu running */
                        setGamePressed: setGamePressed,
                        /* feeds a tosu /websocket/v2 style payload */
                        applyGamePayload: function (payload) {
                            applyGamePayload(payload);
                            return { state: gameStateName, playing: isPlaying };
                        },
                        visibility: function () {
                            return {
                                state: gameStateName,
                                playing: isPlaying,
                                hidden: Boolean(rootEl && rootEl.style.display === 'none'),
                                settingsSocketOpen: Boolean(
                                    settingsSocket && settingsSocket.readyState === 1
                                ),
                                stateSocketOpen: Boolean(
                                    stateSocket && stateSocket.readyState === 1
                                ),
                                /* the optional companion repair */
                                companionSwitch: view.fixAnalyserOnStateChange === true,
                                gameStateName: gameStateName
                            };
                        },
                        source: function () {
                            return {
                                active: activeSource,
                                keyboardSeen: keyboardSeen,
                                probeDone: keyboardProbeDone,
                                probeMs: view.inputProbeMs,
                                inputMode: view.inputMode,
                                inputStarted: inputStarted,
                                probePending: Boolean(probeTimer),
                                socketOpen: Boolean(gameSocket && gameSocket.readyState === 1),
                                gamePressed: gamePressed
                            };
                        },
                        state: function () {
                            return {
                                settings: settings,
                                settingsSource: settingsSource,
                                settingsError: lastSettingsError,
                                settingsUrl: lastSettingsUrl,
                                settingsFetchState: settingsFetchState,
                                origin: window.location.href,
                                activeSource: activeSource,
                                keyboardSeen: keyboardSeen,
                                rebuilds: rebuildCount,
                                socketOpen: Boolean(gameSocket && gameSocket.readyState === 1),
                                socketMessages: gameSocketMessages,
                                tosuKeys: lastGameKeys,
                                tosuPayload: lastGamePayload,
                                keys: keys.map(function (k) {
                                    return {
                                        code: k.code,
                                        gameSlot: k.gameSlot,
                                        display: k.display,
                                        label: k.label,
                                        pressed: k.pressed
                                    };
                                }),
                                rain: rain.length,
                                layout: layout
                            };
                        }
                    };

                    log('ready');
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', boot);
                } else {
                    boot();
                }

                /* tiny pure-function surface, used by tests/tools/keys.test.js */
                window.__keyviewerInternals = {
                    resolveCode: resolveCode,
                    resolveDisplay: resolveDisplay,
                    parseDisplayText: parseDisplayText,
                    parseGameSlots: parseGameSlots,
                    codeDefaultLabel: codeDefaultLabel,
                    parseColor: parseColor,
                    normalize: normalize,
                    /* normalize() reads the Dashboard set from module scope, so a
                       test needs a way to install one */
                    setDashboardValues: function (values) {
                        dashboardValues = values || {};
                        settingsEverAppliedFromDashboard = false;
                        lastGoodSettings = null;
                    },
                    allCodes: ALL_CODES.slice(),
                    /* the settings that were removed from the Dashboard but are
                       still implemented and pinned - see LOCKED_SETTINGS */
                    LOCKED_SETTINGS: LOCKED_SETTINGS.slice(),
                    DEFAULTS: DEFAULTS,
                    /* Test-only: pretend the URL carried ?config=<values>.
                       A headless harness cannot change window.location, and the
                       URL override is the supported way to reach the locked
                       behaviours, so it has to be testable. Pass null to clear. */
                    setUrlOverride: function (values) {
                        urlOverrideInjected = values || null;
                        return normalize(lastLoadedJson);
                    }
                };
            })();
        </script>
    </body>
</html>
