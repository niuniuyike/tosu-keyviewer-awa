<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>keyviewer_awa</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                font-family: 'Segoe UI', Roboto, 'Microsoft YaHei', Arial,
                    sans-serif;
            }

            #overlay_host {
                position: relative;
                width: 100%;
                height: 100%;
            }

            #rain_canvas {
                position: absolute;
                left: 0;
                top: 0;
                display: block;
                pointer-events: none;
            }

            #key_squares {
                position: absolute;
                left: 0;
                width: 100%;
                display: flex;
                flex-direction: row;
                align-items: flex-end;
                justify-content: center;
            }

            .keyviewer-key {
                position: relative;
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: transparent;
                overflow: hidden;
                /* keep the frame from being cut by the canvas */
                contain: paint;
            }

            .keyviewer-key .keyv-glow {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                opacity: 0;
                transition: opacity 60ms linear;
            }

            .keyviewer-key .keyv-letter {
                position: relative;
                display: block;
                max-width: 100%;
                line-height: 1;
                text-align: center;
                white-space: nowrap;
                user-select: none;
                -webkit-user-select: none;
                font-weight: 700;
                transform: translateY(1px);
            }
        </style>
    </head>
    <body>
        <div id="overlay_host">
            <canvas id="rain_canvas"></canvas>
            <div id="key_squares"></div>
        </div>

        <script>
            (function () {
                'use strict';

                /* ------------------------------------------------------------------ *
                 * 1. Default settings (must mirror settings.json)
                 *
                 * uniqueID must be alphanumeric only: tosu runs
                 * uniqueID.replace(/[^a-z0-9]/gim, '') on every save, and a stored
                 * id containing "_" would then never match again.
                 * ------------------------------------------------------------------ */

                var DEFAULTS = {
                    /* ------------------------------------------------------------ *
                     * Locked values.
                     *
                     * These four used to be Dashboard settings. They are no
                     * longer exposed, but the FEATURES are all still here - the
                     * code paths below are unchanged. The values are pinned to
                     * the ones that were picked, and applying a setting can no
                     * longer change them.
                     *
                     *   inputMode    'game'  -> read keys from tosu, not from
                     *                           keyboard events. Works without
                     *                           keyboard focus, which is what OBS
                     *                           needs, and is what mania 4k uses.
                     *   inputProbeMs 4000    -> only relevant to the 'auto'
                     *                           probe, kept so the probe code is
                     *                           untouched.
                     *   gameSlots    k1 k2 m1 m2 -> tosu's four counter slots,
                     *                           one per square, in order.
                     *   rainMode     'bar'   -> KeyViewer's original rain: the
                     *                           bar grows upward from the square
                     *                           while held, then drifts and fades.
                     *                           The 'blocks' mode is still
                     *                           implemented below and still
                     *                           reachable via ?config=.
                     * ------------------------------------------------------------ */
                    inputMode: 'game',
                    inputProbeMs: 4000,
                    gameSlots: 'k1\nk2\nm1\nm2',
                    rainMode: 'bar',
                    showInputStatus: false,
                    /* the text shown on the four squares, in order. Blank lines keep
                       the name of the slot feeding that square (K1, K2, M1, M2). */
                    displayText: 'Z\nX\nC\nY'.replace('Y', 'V'),
                    /* true = only visible while a map is being played */
                    showDuringPlay: false,
                    /* opt-in: reload a neighbouring ManiaMapAnalyser when its card
                       sticks on a stale visibility. Off by default because it is a
                       repair for someone else's bug, not part of this overlay. */
                    fixAnalyserOnStateChange: false,
                    /* 'precise' keeps the key stream on the endpoint the key viewer
                       has always used; 'general' moves it to the slower endpoint that
                       also carries game state (fewer sockets, slower keys) */
                    gameSocket: 'precise',

                    squareSize: 56,
                    squareScale: 100,
                    squareGap: 8,
                    borderWidth: 2,
                    borderRadius: 8,
                    letterScale: 100,

                    borderColor: '#ffffff',
                    borderOpacity: 100,
                    letterColor: '#ffffff',
                    letterOpacity: 100,
                    pressColor: '#ff66aa',
                    pressOpacity: 80,
                    releaseColor: '#ffffff',
                    releaseOpacity: 18,

                    rainColor: '#ffd6ea',
                    rainOpacity: 85,
                    rainFlowSpeed: 400,
                    rainBarLength: 400,
                    /* geometry for the optional "blocks" shape. Not exposed in the
                       Dashboard any more, but kept so both shapes stay valid. */
                    rainBlockHeight: 14,
                    rainBlockWidth: 100,
                    rainBarGap: 14,
                    rainRoundness: 0,
                    rainFadePosition: 30,
                    rainMinAlpha: 0,

                    debugStatus: false
                };

                var NUMERIC_LIMITS = {
                    inputProbeMs: [100, 600000],
                    squareSize: [8, 400],
                    squareScale: [20, 400],
                    squareGap: [0, 200],
                    borderWidth: [0, 40],
                    borderRadius: [0, 200],
                    letterScale: [20, 400],
                    borderOpacity: [0, 100],
                    letterOpacity: [0, 100],
                    pressOpacity: [0, 100],
                    releaseOpacity: [0, 100],
                    rainOpacity: [0, 100],
                    rainFlowSpeed: [0, 4000],
                    rainBarLength: [4, 4000],
                    rainRoundness: [0, 100],
                    rainFadePosition: [0, 100],
                    rainMinAlpha: [0, 100]
                };

                var BOOLEAN_KEYS = [
                    'debugStatus',
                    'showInputStatus',
                    'showDuringPlay',
                    'fixAnalyserOnStateChange'
                ];

                /* Settings whose value is fixed: they used to be Dashboard
                   options and were removed from settings.json, but every code
                   path that uses them is still here. Pinning them means an old
                   values file or a stale broadcast cannot bring the old value
                   back. `?config=` still overrides them on purpose, so the
                   alternative behaviours stay reachable without a UI. */
                var LOCKED_SETTINGS = [
                    'inputMode',
                    'inputProbeMs',
                    'gameSlots',
                    'rainMode'
                ];

                /* ------------------------------------------------------------------ *
                 * 2. Keyboard knowledge base
                 *    event.code is layout independent, which is what a key viewer
                 *    wants. We still keep a large alias table so users may type
                 *    "ctrl", "numpad1", "space", "shift right", "F12", ";" ... 
                 * ------------------------------------------------------------------ */

                /* numbers: event.code -> [letter, shifted letter] */
                var SYMBOL_MAP = {
                    Backquote: ['`', '~'],
                    Minus: ['-', '_'],
                    Equal: ['=', '+'],
                    BracketLeft: ['[', '{'],
                    BracketRight: [']', '}'],
                    Backslash: ['\\', '|'],
                    Semicolon: [';', ':'],
                    Quote: ["'", '"'],
                    Comma: [',', '<'],
                    Period: ['.', '>'],
                    Slash: ['/', '?'],
                    Space: [' ', ' ']
                };

                var NUMPAD_SYMBOLS = [
                    'NumpadDivide',
                    'NumpadMultiply',
                    'NumpadSubtract',
                    'NumpadAdd',
                    'NumpadDecimal',
                    'NumpadComma'
                ];

                var NUMPAD_LETTERS = {
                    NumpadDivide: '/',
                    NumpadMultiply: '*',
                    NumpadSubtract: '-',
                    NumpadAdd: '+',
                    NumpadComma: ',',
                    NumpadDecimal: '.',
                    NumpadEnter: 'ENT',
                    NumpadEqual: '='
                };

                /* optional compact labels, so narrow squares stay readable */
                var SHORT_LABELS = {
                    Space: 'SPC',
                    Enter: 'ENT',
                    NumpadEnter: 'ENT',
                    Backspace: 'BSP',
                    Delete: 'DEL',
                    Insert: 'INS',
                    Escape: 'ESC',
                    CapsLock: 'CAP',
                    Tab: 'TAB',
                    ShiftLeft: 'SH',
                    ShiftRight: 'RSH',
                    ControlLeft: 'CT',
                    ControlRight: 'RCT',
                    AltLeft: 'AL',
                    AltRight: 'RAL',
                    MetaLeft: 'WIN',
                    MetaRight: 'RWN',
                    ContextMenu: 'MNU',
                    PageUp: 'PGU',
                    PageDown: 'PGD',
                    PrintScreen: 'PRT',
                    ScrollLock: 'SCR',
                    NumLock: 'NUM',
                    Pause: 'PSE',
                    ArrowLeft: '\u2190',
                    ArrowRight: '\u2192',
                    ArrowUp: '\u2191',
                    ArrowDown: '\u2193',
                    NumpadAdd: 'N+',
                    NumpadSubtract: 'N-',
                    NumpadMultiply: 'N*',
                    NumpadDivide: 'N/',
                    NumpadDecimal: 'N.',
                    NumpadComma: 'N,',
                    NumpadEqual: 'N='
                };

                var ALL_CODES = [];
                var charMap = {};
                var shiftCharMap = {};
                var aliasMap = {};
                var labelLookup = {};

                (function buildKeyDatabase() {
                    function addCode(code, letter, shifted) {
                        ALL_CODES.push(code);
                        charMap[code] = letter;
                        shiftCharMap[code] = shifted || letter;
                    }

                    function addAlias(name, code) {
                        var key = String(name).toLowerCase();
                        if (!aliasMap[key]) aliasMap[key] = code;
                    }

                    /* letters */
                    for (var i = 0; i < 26; i++) {
                        var letter = String.fromCharCode(65 + i);
                        addCode('Key' + letter, letter, letter);
                    }

                    /* number row */
                    var digitShift = [')', '!', '@', '#', '$', '%', '^', '&', '*', '('];
                    for (var n = 0; n <= 9; n++) {
                        addCode('Digit' + n, String(n), digitShift[n]);
                    }

                    /* function keys */
                    for (var f = 1; f <= 24; f++) addCode('F' + f, 'F' + f, 'F' + f);

                    /* symbols */
                    var symbolCodes = Object.keys(SYMBOL_MAP);
                    for (var s = 0; s < symbolCodes.length; s++) {
                        var sc = symbolCodes[s];
                        addCode(sc, SYMBOL_MAP[sc][0], SYMBOL_MAP[sc][1]);
                    }

                    /* modifiers, both sides */
                    addCode('ControlLeft', 'CTRL', 'CTRL');
                    addCode('ControlRight', 'RCTRL', 'RCTRL');
                    addCode('ShiftLeft', 'SHIFT', 'SHIFT');
                    addCode('ShiftRight', 'RSHIFT', 'RSHIFT');
                    addCode('AltLeft', 'ALT', 'ALT');
                    addCode('AltRight', 'RALT', 'RALT');
                    addCode('MetaLeft', 'WIN', 'WIN');
                    addCode('MetaRight', 'RWIN', 'RWIN');
                    addCode('ContextMenu', 'MENU', 'MENU');

                    /* editing / navigation / locks / system */
                    var named = {
                        Escape: 'ESC',
                        Tab: 'TAB',
                        CapsLock: 'CAPS',
                        Backspace: 'BKSP',
                        Enter: 'ENTER',
                        Insert: 'INS',
                        Delete: 'DEL',
                        Home: 'HOME',
                        End: 'END',
                        PageUp: 'PGUP',
                        PageDown: 'PGDN',
                        ArrowLeft: '\u2190',
                        ArrowRight: '\u2192',
                        ArrowUp: '\u2191',
                        ArrowDown: '\u2193',
                        PrintScreen: 'PRTSC',
                        ScrollLock: 'SCRLK',
                        Pause: 'PAUSE',
                        NumLock: 'NUMLK'
                    };
                    var namedCodes = Object.keys(named);
                    for (var c = 0; c < namedCodes.length; c++)
                        addCode(namedCodes[c], named[namedCodes[c]], named[namedCodes[c]]);

                    /* media & browser & IME keys, reported by Windows/Chromium */
                    var media = {
                        IntlBackslash: '\\',
                        IntlRo: '\\',
                        IntlYen: '\u00a5',
                        Convert: 'HENK',
                        NonConvert: 'MUHEN',
                        KanaMode: 'KANA',
                        Lang1: 'HANJA',
                        Lang2: 'HAN/Y',
                        Lang3: 'LANG3',
                        Lang4: 'LANG4',
                        Lang5: 'LANG5',
                        AudioVolumeMute: 'MUTE',
                        AudioVolumeDown: 'VOL-',
                        AudioVolumeUp: 'VOL+',
                        MediaTrackNext: 'NEXT',
                        MediaTrackPrevious: 'PREV',
                        MediaStop: 'STOP',
                        MediaPlayPause: 'PLAY',
                        BrowserBack: 'BACK',
                        BrowserForward: 'FWD',
                        BrowserRefresh: 'REFR',
                        BrowserStop: 'BSTOP',
                        BrowserSearch: 'SRCH',
                        BrowserFavorites: 'FAV',
                        BrowserHome: 'BHOME',
                        LaunchMail: 'MAIL',
                        LaunchApp1: 'APP1',
                        LaunchApp2: 'APP2'
                    };
                    var mediaCodes = Object.keys(media);
                    for (var m = 0; m < mediaCodes.length; m++)
                        addCode(mediaCodes[m], media[mediaCodes[m]], media[mediaCodes[m]]);

                    /* numpad */
                    for (var k = 0; k <= 9; k++) {
                        addCode('Numpad' + k, String(k), String(k));
                        addAlias('num' + k, 'Numpad' + k);
                        if (k > 0) addAlias('kp' + k, 'Numpad' + k);
                    }
                    for (var q = 0; q < NUMPAD_SYMBOLS.length; q++) {
                        var nc = NUMPAD_SYMBOLS[q];
                        addCode(nc, NUMPAD_LETTERS[nc], NUMPAD_LETTERS[nc]);
                    }
                    addCode('NumpadEnter', 'ENT', 'ENT');
                    addCode('NumpadEqual', '=', '=');

                    /* ---------------- aliases ---------------- */
                    for (var a = 0; a < 26; a++) {
                        var al = String.fromCharCode(65 + a);
                        addAlias(al, 'Key' + al);
                        addAlias('key' + al, 'Key' + al);
                        aliasMap[al.toLowerCase()] = 'Key' + al;
                    }
                    for (var d = 0; d <= 9; d++) {
                        addAlias(String(d), 'Digit' + d);
                        addAlias('digit' + d, 'Digit' + d);
                    }

                    var aliasList = {
                        ctrl: 'ControlLeft',
                        control: 'ControlLeft',
                        ctrlleft: 'ControlLeft',
                        controlleft: 'ControlLeft',
                        leftctrl: 'ControlLeft',
                        leftcontrol: 'ControlLeft',
                        ctrlright: 'ControlRight',
                        controlright: 'ControlRight',
                        rightctrl: 'ControlRight',
                        rightcontrol: 'ControlRight',
                        shift: 'ShiftLeft',
                        shiftleft: 'ShiftLeft',
                        leftshift: 'ShiftLeft',
                        shiftright: 'ShiftRight',
                        rightshift: 'ShiftRight',
                        alt: 'AltLeft',
                        altleft: 'AltLeft',
                        leftalt: 'AltLeft',
                        option: 'AltLeft',
                        altright: 'AltRight',
                        rightalt: 'AltRight',
                        altgr: 'AltRight',
                        win: 'MetaLeft',
                        windows: 'MetaLeft',
                        super: 'MetaLeft',
                        cmd: 'MetaLeft',
                        command: 'MetaLeft',
                        meta: 'MetaLeft',
                        lwin: 'MetaLeft',
                        rwin: 'MetaRight',
                        menu: 'ContextMenu',
                        contextmenu: 'ContextMenu',
                        app: 'ContextMenu',

                        esc: 'Escape',
                        escape: 'Escape',
                        tab: 'Tab',
                        caps: 'CapsLock',
                        capslock: 'CapsLock',
                        bksp: 'Backspace',
                        back: 'Backspace',
                        backspace: 'Backspace',
                        enter: 'Enter',
                        return: 'Enter',
                        ins: 'Insert',
                        insert: 'Insert',
                        del: 'Delete',
                        delete: 'Delete',
                        home: 'Home',
                        end: 'End',
                        pageup: 'PageUp',
                        pgup: 'PageUp',
                        pagedown: 'PageDown',
                        pgdn: 'PageDown',
                        arrowleft: 'ArrowLeft',
                        left: 'ArrowLeft',
                        arrowright: 'ArrowRight',
                        right: 'ArrowRight',
                        arrowup: 'ArrowUp',
                        up: 'ArrowUp',
                        arrowdown: 'ArrowDown',
                        down: 'ArrowDown',
                        prtsc: 'PrintScreen',
                        printscreen: 'PrintScreen',
                        scrlk: 'ScrollLock',
                        scrolllock: 'ScrollLock',
                        pause: 'Pause',
                        numlk: 'NumLock',
                        numlock: 'NumLock',

                        spacebar: 'Space',
                        space: 'Space',

                        numpad0: 'Numpad0',
                        numpad1: 'Numpad1',
                        numpad2: 'Numpad2',
                        numpad3: 'Numpad3',
                        numpad4: 'Numpad4',
                        numpad5: 'Numpad5',
                        numpad6: 'Numpad6',
                        numpad7: 'Numpad7',
                        numpad8: 'Numpad8',
                        numpad9: 'Numpad9',
                        numpadenter: 'NumpadEnter',
                        numpadadd: 'NumpadAdd',
                        numpadsub: 'NumpadSubtract',
                        numpadsu: 'NumpadSubtract',
                        numpadmul: 'NumpadMultiply',
                        numpaddiv: 'NumpadDivide',
                        numpaddec: 'NumpadDecimal',
                        numpadcomma: 'NumpadComma',
                        ';': 'Semicolon',
                        ':': 'Semicolon',
                        "'": 'Quote',
                        '"': 'Quote',
                        ',': 'Comma',
                        '<': 'Comma',
                        '.': 'Period',
                        '>': 'Period',
                        '/': 'Slash',
                        '?': 'Slash',
                        '\\': 'Backslash',
                        '|': 'Backslash',
                        '-': 'Minus',
                        _: 'Minus',
                        '=': 'Equal',
                        '+': 'Equal',
                        '[': 'BracketLeft',
                        '{': 'BracketLeft',
                        ']': 'BracketRight',
                        '}': 'BracketRight',
                        '`': 'Backquote',
                        '~': 'Backquote'
                    };
                    var aliasNames = Object.keys(aliasList);
                    for (var an = 0; an < aliasNames.length; an++)
                        addAlias(aliasNames[an], aliasList[aliasNames[an]]);

                    /* label reverse lookup, so a player may simply type the letter
                       they see on their keyboard, e.g. "RCTRL", "PGDN", "N1" */
                    for (var lc = 0; lc < ALL_CODES.length; lc++) {
                        var codeX = ALL_CODES[lc];
                        var lbl = String(charMap[codeX]).toLowerCase();
                        addAlias(lbl, codeX);
                        addAlias(codeX.toLowerCase(), codeX);
                        if (!labelLookup[lbl]) labelLookup[lbl] = codeX;
                    }
                })();

                /* Map a user typed token onto an event.code, or null when unknown. */
                function resolveCode(raw) {
                    if (raw == null) return null;

                    var input = String(raw).trim();
                    if (!input) return null;

                    /* "KeyZ=Z" lets a player pin an explicit letter */
                    var eq = input.indexOf('=');
                    if (eq > 0) input = input.slice(0, eq).trim();
                    if (!input) return null;

                    /* exact code, case sensitive list first */
                    for (var i = 0; i < ALL_CODES.length; i++) {
                        if (ALL_CODES[i] === input) return input;
                    }

                    var lower = input.toLowerCase();
                    var folded = lower.replace(/[\s_-]+/g, '');

                    if (aliasMap[lower]) return aliasMap[lower];
                    if (aliasMap[folded]) return aliasMap[folded];

                    if (input.length > 1) return null;

                    /* last resort: the physical letter printed on the key */
                    var single = labelLookup[lower];
                    if (single) return single;

                    return null;
                }

                function explicitLabel(raw) {
                    if (raw == null) return null;
                    var eq = String(raw).indexOf('=');
                    if (eq <= 0) return null;
                    var label = String(raw).slice(eq + 1).trim();
                    return label ? label : null;
                }

                function codeChar(code, shifted) {
                    if (shifted && shiftCharMap[code]) {
                        var s = shiftCharMap[code];
                        return s === ' ' ? 'SPACE' : s;
                    }
                    var c = charMap[code];
                    if (c === undefined) return code;
                    return c === ' ' ? 'SPACE' : c;
                }

                function codeDefaultLabel(code) {
                    if (code == null) return '--';
                    var c = charMap[code];
                    if (c !== undefined) return String(c);
                    return code;
                }

                /* Display string for a resolved key. */
                function resolveDisplay(raw, labelMode) {
                    var label = explicitLabel(raw);
                    if (label) return label;

                    var code = resolveCode(raw);
                    if (code == null) {
                        var fallback = String(raw == null ? '' : raw).trim();
                        return fallback ? fallback.slice(0, 6) : '--';
                    }

                    switch (labelMode) {
                        case 'code':
                            return code;
                        case 'short':
                            return SHORT_LABELS[code] || codeChar(code, false);
                        case 'charShift':
                            return codeChar(code, true);
                        case 'char':
                        default:
                            return codeChar(code, false);
                    }
                }

                /* ------------------------------------------------------------------ *
                 * 3. Small helpers
                 * ------------------------------------------------------------------ */

                function clamp(v, limit) {
                    if (v !== v) return limit[0];
                    if (v < limit[0]) return limit[0];
                    if (v > limit[1]) return limit[1];
                    return v;
                }

                function coerceNumber(key, value, fallback) {
                    var num = typeof value === 'number' ? value : parseFloat(value);
                    if (num !== num || num === Infinity || num === -Infinity) {
                        num = fallback;
                    }
                    var limit = NUMERIC_LIMITS[key];
                    return limit ? clamp(num, limit) : num;
                }

                function coerceBool(value) {
                    if (typeof value === 'boolean') return value;
                    if (typeof value === 'string') return value.toLowerCase() === 'true';
                    return Boolean(value);
                }

                /* "#rgb" / "#rrggbb" / "rgb(r,g,b)" / named -> [r, g, b] */
                var NAMED_COLORS = {
                    white: [255, 255, 255],
                    black: [0, 0, 0],
                    red: [255, 0, 0],
                    green: [0, 128, 0],
                    blue: [0, 0, 255],
                    yellow: [255, 255, 0],
                    cyan: [0, 255, 255],
                    aqua: [0, 255, 255],
                    magenta: [255, 0, 255],
                    fuchsia: [255, 0, 255],
                    pink: [255, 192, 203],
                    orange: [255, 165, 0],
                    purple: [128, 0, 128],
                    gray: [128, 128, 128],
                    grey: [128, 128, 128],
                    lime: [0, 255, 0],
                    navy: [0, 0, 128],
                    teal: [0, 128, 128],
                    gold: [255, 215, 0],
                    transparent: [0, 0, 0]
                };

                function parseColor(input) {
                    var fallback = [255, 255, 255];
                    if (input == null) return fallback;

                    var text = String(input).trim().toLowerCase();
                    if (!text) return fallback;

                    if (text.charAt(0) === '#') {
                        var hex = text.slice(1);
                        if (hex.length === 3 || hex.length === 4) {
                            var r3 = parseInt(hex.charAt(0) + hex.charAt(0), 16);
                            var g3 = parseInt(hex.charAt(1) + hex.charAt(1), 16);
                            var b3 = parseInt(hex.charAt(2) + hex.charAt(2), 16);
                            if (r3 === r3 && g3 === g3 && b3 === b3) return [r3, g3, b3];
                        }
                        if (hex.length === 6 || hex.length === 8) {
                            var r6 = parseInt(hex.slice(0, 2), 16);
                            var g6 = parseInt(hex.slice(2, 4), 16);
                            var b6 = parseInt(hex.slice(4, 6), 16);
                            if (r6 === r6 && g6 === g6 && b6 === b6) return [r6, g6, b6];
                        }
                        return fallback;
                    }

                    var rgbMatch = text.match(/^rgba?\(([^)]+)\)$/);
                    if (rgbMatch) {
                        var parts = rgbMatch[1].split(',');
                        if (parts.length >= 3) {
                            var r8 = parseInt(parts[0], 10);
                            var g8 = parseInt(parts[1], 10);
                            var b8 = parseInt(parts[2], 10);
                            if (r8 === r8 && g8 === g8 && b8 === b8) return [r8, g8, b8];
                        }
                        return fallback;
                    }

                    if (NAMED_COLORS[text]) return NAMED_COLORS[text];

                    /* allow a bare hex string without "#" */
                    if (/^[0-9a-f]{6}$/.test(text)) {
                        return [
                            parseInt(text.slice(0, 2), 16),
                            parseInt(text.slice(2, 4), 16),
                            parseInt(text.slice(4, 6), 16)
                        ];
                    }

                    return fallback;
                }

                function cssColor(rgb, alpha) {
                    var a = alpha === undefined ? 1 : clamp(alpha, [0, 1]);
                    return (
                        'rgba(' +
                        Math.round(rgb[0]) +
                        ',' +
                        Math.round(rgb[1]) +
                        ',' +
                        Math.round(rgb[2]) +
                        ',' +
                        (Math.round(a * 1000) / 1000) +
                        ')'
                    );
                }

                function parseKeyList(text) {
                    if (text == null) return null;
                    var raw = Array.isArray(text) ? text.join('\n') : String(text);
                    var out = [];
                    var lines = raw.split(/\r?\n/);
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line) out.push(line);
                    }
                    return out.length ? out : null;
                }

                /* ---- game input slots (tosu's keys.k1/k2/m1/m2) ---- */

                            drawHeight += y;
                            y = 0;
                        }
                        if (y + drawHeight > layout.rainHeight) {
                            drawHeight = layout.rainHeight - y;
                        }
                        if (!(drawHeight > 0)) continue;

                        rainCtx.fillStyle = cssColor(rgb, Math.min(1, opacity));
                        roundedRect(rainCtx, x, y, width, drawHeight, radius);
                        rainCtx.fill();
                    }
                }

                /* ------------------------------------------------------------------ *
                 * 7. Frame loop (independent of the DOM update loop, so key rain keeps
                 *    flowing even while the window is being resized)
                 * ------------------------------------------------------------------ */

                function loop(now) {
                    rafId = requestAnimationFrame(loop);

                    var dt = 0;
                    var rawMs = 0;
                    if (lastFrame) {
                        rawMs = now - lastFrame;
                        dt = rawMs / 1000;
                    }
                    lastFrame = now;

                    /* Sample the RAW interval, before the clamp below. Reading the
                       clamped value would report every stall longer than 250ms as
                       exactly 250ms, which is precisely the number that matters when
                       diagnosing judder. Sampled before the early return too, so a
                       host that throttles the loop itself is still visible. */
                    if (isDebug()) noteFrameInterval(rawMs);

                    if (dt < 0) dt = 0;
                    if (dt > 0.25) dt = 0.25;

                    /* Hidden because no map is being played. Nothing is drawn and
                       nothing advances, so the overlay costs almost no CPU while it
                       is out of the way - it must not compete with other overlays for
                       frames. Key state is still tracked; the rain just waits.

                       The loop may stop being called entirely in some hosts, so never
                       leave tracked work pending without a way to run it. */
                    if (view.showDuringPlay === true && !isPlaying) {
                        if (frameQueued || needsRebuild) runFrameUpdate();
                        /* keep the pacing meter readable in this state too - it is
                           exactly where someone checks whether the overlay is being
                           throttled while "hidden" */
                        if (isDebug() && debugEl && ++debugFrames % 10 === 0) {
                            try {
                                updateDebugText();
                            } catch (error) {
                                /* the readout must never break the loop */
                            }
                        }
                        return;
                    }

                    /* The rain must never stop because of a diagnostic. A throwing
                       debug readout would otherwise break every frame while
                       ?debug=1 is on, which looks exactly like "the rain is broken". */
                    try {
                        var hadRain = rain.length > 0;
                        updateRain(dt);
                        if (hadRain && !rain.length) {
                            /* the last piece just went away: clear the canvas once */
                            rainNeedsRedraw = true;
                        }
                        /* while anything is on screen the picture changes every
                           frame; once it is empty, the canvas stays clean */
                        if (rain.length || rainNeedsRedraw) {
                            drawRain();
                            rainNeedsRedraw = false;
                        }
                    } catch (error) {
                        if (!loopErrorReported) {
                            loopErrorReported = true;
                            lastSettingsError = 'rain: ' + ((error && error.message) || error);
                            log('rain loop error', lastSettingsError);
                        }
                    }

                    if (isDebug() && debugEl) {
                        debugFrames++;
                        /* 10 frames is frequent enough to watch the meter settle
                           while still keeping the DOM write off most frames */
                        if (debugFrames % 10 === 0) {
                            try {
                                updateDebugText();
                            } catch (error) {
                                debugEl.textContent =
                                    'debug readout failed: ' +
                                    ((error && error.message) || error);
                            }
                        }
                    }
                }

                function updateDebugText() {
                    if (!debugEl) return;
                    var pressed = [];
                    for (var i = 0; i < keys.length; i++) {
                        if (keys[i].pressed) {
                            pressed.push(
                                keys[i].code ||
                                    (keys[i].gameSlot ? keys[i].gameSlot.toUpperCase() : null) ||
                                    keys[i].display ||
                                    '?'
                            );
                        }
                    }
                    debugEl.textContent =
                        framePacingText() +
                        '\ninput=' +
                        activeSource +
                        '(kbd ' +
                        (keyboardSeen ? 'yes' : 'no') +
                        ', ws ' +
                        (gameSocket && gameSocket.readyState === 1 ? 'open' : 'closed') +
                        ', msgs ' +
                        gameSocketMessages +
                        ')' +
                        ' tosu.keys=[' +
                        lastGameKeys +
                        '] ' +
                        lastGamePayload +
                        ' show=' +
                        (view.showInputStatus === true ? 'on' : 'off') +
                        ' keys=' +
                        keys.length +
                        ' size=' +
                        layout.square.toFixed(1) +
                        ' area=' +
                        canvasWidth +
                        'x' +
                        canvasHeight.toFixed(0) +
                        ' fadeY=' +
                        layout.fadeY.toFixed(1) +
                        ' drops=' +
                        rain.length +
                        ' settings=' +
                        (lastSettingsError ? 'ERR ' + lastSettingsError : settingsSource) +
                        ' url=' +
                        lastSettingsUrl +
                        ' cfg=' +
                        (readUrlOverride() ? 'yes' : 'no') +
                        ' pressed=[' +
                        pressed.join(',') +
                        ']';
                }

                /* ------------------------------------------------------------------ *
                 * 8. Live updates = the whole point of the resize requirement
                 * ------------------------------------------------------------------ */

                var resizeObserver = null;

                function handleResize() {
                    /* canvas math depends on the host box, rebuild it right away so
                       the next animation frame already uses correct metrics */
                    computeLayout();
                    resizeCanvas();
                    applyStyles();
                }

                function watchResize() {
                    if (typeof ResizeObserver === 'function') {
                        resizeObserver = new ResizeObserver(handleResize);
                        resizeObserver.observe(hostEl);
                    }

                    window.addEventListener('resize', handleResize);

                    /* OBS browser sources sometimes only report a device pixel
                       ratio change, which no resize event covers */
                    if (window.matchMedia) {
                        var query = window.matchMedia(
                            '(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)'
                        );
                        if (query.addEventListener) {
                            query.addEventListener('change', handleResize);
                        }
                    }
                }

                /* ------------------------------------------------------------------ *
                 * 9. Input
                 *
                 * There are two independent sources, because neither one works
                 * everywhere (this is the thing that makes a key overlay "do
                 * nothing" in OBS):
                 *
                 *   keyboard - the overlay listens to its own keydown/keyup. Works
                 *              for ANY key, but only while the overlay page actually
                 *              owns the keyboard focus. OBS browser sources usually
                 *              do not (they are click-through, and a global hotkey
                 *              forwards to OBS, not to the source), which is exactly
                 *              the "no reaction at all" symptom.
                 *
                 *   game     - the real tosu data stream: connect to
                 *              /websocket/v2/precise and read keys.k1/k2/m1/m2.
                 *              Works with zero focus, and it is what every working
                 *              tosu key overlay (e.g. Team-BTMC/key-overlay) uses.
                 *              Trade-off: tosu only exposes the four keys the game
                 *              itself counts, so arbitrary keys are impossible here.
                 *
                 * `auto` probes once: if no key ever arrives from the keyboard, it
                 * falls back to the game data so the overlay is never dead.
                 * ------------------------------------------------------------------ */

                var KEYBOARD_SOURCE = 'keyboard';
                var GAME_SOURCE = 'game';

                var KEYBOARD_PROBE_MS = 4000;
                var gamePressed = { k1: false, k2: false, m1: false, m2: false };
                var activeSource = KEYBOARD_SOURCE;
                var keyboardSeen = false;
                var keyboardProbeDone = false;
                var probeTimer = null;
                var inputStarted = false;
                var gameSocket = null;
                var gameSocketRetry = 0;
                var gameSocketTimer = null;
                var gameSocketMessages = 0;
                var lastGameKeys = 'none';
                var lastGamePayload = '';
                var autoSlotsDone = false;
                var slotPlanConfigured = false;
                var gameStateName = 'unknown';
                var isPlaying = false;
                var rootEl = null;
                var stateSocket = null;
                var stateSocketTimer = null;
                var stateRetry = 0;
                var statusSquares = [];
                var statusEl = null;

                /* ---- per-key state, shared by both sources ---- */
                function setKeyPressed(index, pressed, source) {
                    var key = keys[index];
                    if (!key) return false;

                    var slot = key.gameSlot;
                    var flag = source === GAME_SOURCE ? 'gamePressed' : 'keyboardPressed';

                    if (key[flag] === pressed) return false;
                    key[flag] = pressed;

                    var next = source === GAME_SOURCE ? key.gamePressed : key.keyboardPressed;
                    if (key.pressed === next) {
                        /* the value did not change, but the source that owns it did */
                        renderKey(index);
                        return false;
                    }

                    key.pressed = next;
                    renderKey(index);
                    return true;
                }

                function renderKey(index) {
                    var key = keys[index];
                    var square = squares[index];
                    if (!key || !square) return;

                    square.glow.style.opacity = key.pressed ? '1' : '0';

                    var label = labelFor(key);
                    if (square.letter.textContent !== label) {
                        square.letter.textContent = label;
                        fitKeyLetter(index);
                    }
                }

                /* setPressed / releaseAll keep their old signature for the hooks */
                function setPressed(code, pressed) {
                    var changed = false;
                    for (var i = 0; i < keys.length; i++) {
                        if (keys[i].code && keys[i].code === code) {
                            if (setKeyPressed(i, pressed, KEYBOARD_SOURCE)) changed = true;
                        }
                    }
                    return changed;
                }

                function setGamePressed(slot, pressed) {
                    if (!slot) return false;

                    var changed = false;
                    for (var i = 0; i < keys.length; i++) {
                        if (keys[i].gameSlot === slot) {
                            if (setKeyPressed(i, pressed, GAME_SOURCE)) changed = true;
                        }
                    }
                    return changed;
                }

                function releaseAll() {
                    var changed = false;
                    for (var i = 0; i < keys.length; i++) {
                        if (keys[i].pressed) {
                            keys[i].pressed = false;
                            keys[i].keyboardPressed = false;
                            keys[i].gamePressed = false;
                            renderKey(i);
                            changed = true;
                        }
                    }
                    return changed;
                }

                function releaseSource(source) {
                    var flag = source === GAME_SOURCE ? 'gamePressed' : 'keyboardPressed';
                    var other = source === GAME_SOURCE ? 'keyboardPressed' : 'gamePressed';
                    for (var i = 0; i < keys.length; i++) {
                        if (!keys[i][flag]) continue;
                        keys[i][flag] = false;
                        if (keys[i].pressed !== keys[i][other]) {
                            keys[i].pressed = keys[i][other];
                            renderKey(i);
                        }
                    }
                }

                /* labels may carry the data source, which makes a dead setup obvious */
                function labelFor(key) {
                    var text = key.label || (key.gameSlot ? key.gameSlot.toUpperCase() : '');
                    if (view.showInputStatus !== true) return text;
                    return key.gameSlot ? text + ' (' + key.gameSlot + ')' : text;
                }

                function refreshLabels() {
                    for (var i = 0; i < keys.length; i++) {
                        var square = squares[i];
                        if (!square || !keys[i]) continue;
                        var label = labelFor(keys[i]);
                        if (square.letter.textContent !== label) {
                            square.letter.textContent = label;
                            fitKeyLetter(i);
                        }
                    }
                }

                /* ---- source selection ---- */
                function setActiveSource(source) {
                    if (activeSource === source) return;
                    activeSource = source;
                    log('input source ->', source);
                    /* whatever the other source had pressed is irrelevant now */
                    releaseSource(source === GAME_SOURCE ? KEYBOARD_SOURCE : GAME_SOURCE);
                    if (source === GAME_SOURCE) connectGameSocket();
                    updateStatus();
                    refreshLabels();
                }

                function probeKeyboard() {
                    if (keyboardProbeDone) return;
                    keyboardProbeDone = true;

                    if (view.inputMode !== 'auto') return;
                    if (keyboardSeen) return;

                    /* no keyboard event reached this page - typical for an OBS
                       browser source, so lean on the tosu data instead of showing
                       a key viewer that never reacts */
                    keyboardProbeDone = false;
                    setActiveSource(GAME_SOURCE);
                    keyboardProbeDone = true;
                    updateStatus();
                }

                function updateStatus() {
                    if (!statusEl) return;
                    var forced =
                        window.location.search.indexOf('diag=1') !== -1 ||
                        window.location.search.indexOf('debug=1') !== -1;
                    if (view.showInputStatus !== true && !forced) {
                        statusEl.style.display = 'none';
                        return;
                    }
                    statusEl.style.display = 'block';

                    var connected = Boolean(gameSocket && gameSocket.readyState === 1);
                    var pressed = [];
                    for (var i = 0; i < keys.length; i++) {
                        if (keys[i].pressed) {
                            pressed.push(keys[i].gameSlot || keys[i].display || '?');
                        }
                    }
                    statusEl.textContent =
                        'kv ' +
                        activeSource +
                        ' | ' +
                        keySocketPath() +
                        ' ' +
                        (connected ? 'open' : 'CLOSED') +
                        ' msgs ' +
                        gameSocketMessages +
                        ' | tosu.keys ' +
                        lastGameKeys +
                        ' | lit ' +
                        (pressed.length ? pressed.join(',') : '-') +
                        ' | state ' +
                        gameStateName +
                        (view.showDuringPlay === true
                            ? isPlaying
                                ? ' (playing: shown)'
                                : ' (not playing: hidden)'
                            : '') +
                        ' | rain ' +
                        rain.length +
                        ' | ' +
                        stateSocketNote();
                }

                /* what the "only while playing" switch is actually keyed off */
                function stateSocketNote() {
                    if (view.showDuringPlay !== true) return 'state socket off';
                    if (keySocketPath() === '/websocket/v2') return 'state via key socket';
                    return (
                        'state socket ' +
                        (stateSocket && stateSocket.readyState === 1 ? 'open' : 'CLOSED')
                    );
                }

                /* ---- the tosu data streams ----
                   Two independent streams, because tosu splits them:

                     keys  -> /websocket/v2/precise   the high frequency endpoint the
                             key counters were always read from. This is the path the
                             key viewer depends on, so it stays the default.
                     state -> /websocket/v2           only needed by "show only while
                             playing", which reads game.state.name. Opened on demand.

                   `数据端点` can point the key stream at the general endpoint instead
                   (fewer sockets, slightly slower keys) for anyone who prefers that. */
                function keySocketPath() {
                    return view.gameSocket === 'general'
                        ? '/websocket/v2'
                        : '/websocket/v2/precise';
                }

                function socketUrl(path) {
                    var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                    var folder = counterFolderName();
                    return (
                        protocol +
                        window.location.host +
                        path +
                        '?l=' +
                        encodeURIComponent(folder || settingsFolderUrl())
                    );
                }

                function gameSocketUrl() {
                    return socketUrl(keySocketPath());
                }

                function stateSocketUrl() {
                    return socketUrl('/websocket/v2');
                }

                /* tosu reports game.state.name as the GameState member name */
                function applyGameState(status) {
                    var name = String(status == null ? '' : status)
                        .trim()
                        .toLowerCase()
                        .replace(/[^a-z]/g, '');

                    var changed = name !== gameStateName;
                    gameStateName = name || 'unknown';
                    var playing = name === 'play' || name === 'gameplay';
                    if (playing !== isPlaying) {
                        isPlaying = playing;
                        updateVisibility();
                    }

                    /* the optional companion repair, see repairCompanion() */
                    if (changed) repairCompanion();
                }

                /* ------------------------------------------------------------------ *
                 * Companion repair switch.
                 *
                 * The analyser page carries a small self-healing guard (installed by
                 * tools/add-analyser-guard.js) that re-asserts its own card visibility
                 * when it sticks. That guard runs inside the analyser's own page, so
                 * nothing has to reach across frames - it simply reads this setting
                 * back from tosu's settings API to know whether it should stand down.
                 * ------------------------------------------------------------------ */

                function repairCompanion() {
                    /* nothing to push: the guard polls the setting itself. Kept so
                       the state-change hook reads clearly. */
                }

                /* "show only while a map is being played" - hidden means the whole
                   overlay stays invisible so nothing is drawn over the menus */
                function updateVisibility() {
                    if (!rootEl) return;
                    if (!rootEl.style) rootEl.style = {};
                    var hide = view.showDuringPlay === true && !isPlaying;
                    rootEl.style.display = hide ? 'none' : 'block';
                }

                /* One incoming tosu payload. Kept separate from the socket so the
                   hook and the tests can feed the same shape. */
                function applyGamePayload(data) {
                    if (!data) return;

                    /* the general endpoint also reports the game state */
                    if (data.state && data.state.name !== undefined) {
                        applyGameState(data.state.name);
                    }

                    if (!data.keys) return;

                    /* Record exactly what tosu sends. This is the single most
                       useful diagnostic when a key viewer "does nothing": if the
                       key names arrive but every isPressed stays false, the data
                       source is the problem, not the overlay. */
                    var names = [];
                    var pressedNames = [];
                    var name;
                    for (name in data.keys) {
                        if (!Object.prototype.hasOwnProperty.call(data.keys, name)) continue;
                        names.push(name);
                        if (data.keys[name] && data.keys[name].isPressed) {
                            pressedNames.push(name);
                        }
                    }
                    lastGameKeys = names.length ? names.join(',') : '(none)';
                    lastGamePayload =
                        'down=' + (pressedNames.length ? pressedNames.join(',') : '-');

                    if (view.inputMode === 'keyboard') return;

                    /* If the user did not configure any mapping, follow whatever slot
                       names tosu actually sends, in order. That way the overlay
                       displays the real data instead of guessing at k1/k2/m1/m2, and
                       it cannot silently miss a game that names its counters
                       differently. */
                    if (!autoSlotsDone && names.length) {
                        autoSlotsDone = true;
                        if (slotPlanConfigured !== true) {
                            var auto = names.slice(0, keys.length);
                            for (var a = 0; a < keys.length && a < auto.length; a++) {
                                if (!keys[a].gameSlot) {
                                    keys[a].gameSlot = auto[a];
                                    keys[a].autoSlot = true;
                                    renderKey(a);
                                    refreshLabels();
                                }
                            }
                            log('auto mapped game slots', auto.join(','));
                        }
                    }

                    for (var m = 0; m < names.length; m++) {
                        var slotName = names[m];
                        var slotEntry = data.keys[slotName];
                        if (!slotEntry) continue;
                        setGamePressed(slotName, Boolean(slotEntry.isPressed));
                    }

                    /* data is flowing: if we were still only probing, this is the
                       moment the overlay has to start trusting it */
                    if (view.inputMode === 'auto' && !keyboardSeen) {
                        setActiveSource(GAME_SOURCE);
                    }
                }

                function connectGameSocket() {
                    if (view.inputMode === 'keyboard') return;
                    if (gameSocket && (gameSocket.readyState === 0 || gameSocket.readyState === 1)) {
                        return;
                    }
                    if (typeof window.WebSocket !== 'function') return;

                    try {
                        gameSocket = new window.WebSocket(gameSocketUrl());
                    } catch (error) {
                        log('game socket failed', error && error.message);
                        scheduleGameReconnect();
                        return;
                    }

                    gameSocket.onopen = function () {
                        gameSocketRetry = 0;
                        log('key socket open', keySocketPath());
                        updateStatus();
                    };

                    gameSocket.onmessage = function (event) {
                        var data;
                        try {
                            data = JSON.parse(event.data);
                        } catch (error) {
                            return;
                        }
                        if (!data) return;

                        gameSocketMessages++;
                        applyGamePayload(data);
                    };

                    gameSocket.onclose = function () {
                        gameSocket = null;
                        releaseSource(GAME_SOURCE);
                        updateStatus();
                        scheduleGameReconnect();
                    };

                    gameSocket.onerror = function () {
                        /* onclose follows and handles the retry */
                    };
                }

                /* The state stream exists only for "show only while playing". It is
                   skipped when the key stream already carries state (general mode) or
                   when the switch is off, so no extra connection is opened needlessly. */
                function needsStateSocket() {
                    if (view.showDuringPlay !== true) return false;
                    return keySocketPath() !== '/websocket/v2';
                }

                function connectStateSocket() {
                    if (!needsStateSocket()) {
                        disconnectStateSocket();
                        return;
                    }
                    if (
                        stateSocket &&
                        (stateSocket.readyState === 0 || stateSocket.readyState === 1)
                    ) {
                        return;
                    }
                    if (typeof window.WebSocket !== 'function') return;

                    try {
                        stateSocket = new window.WebSocket(stateSocketUrl());
                    } catch (error) {
                        log('state socket failed', error && error.message);
                        scheduleStateReconnect();
                        return;
                    }

                    stateSocket.onopen = function () {
                        stateRetry = 0;
                        log('state socket open');
                    };

                    stateSocket.onmessage = function (event) {
                        var data;
                        try {
                            data = JSON.parse(event.data);
                        } catch (error) {
                            return;
                        }
                        if (!data || !data.state || data.state.name === undefined) return;
                        applyGameState(data.state.name);
                    };

                    stateSocket.onclose = function () {
                        stateSocket = null;
                        scheduleStateReconnect();
                    };

                    stateSocket.onerror = function () {
                        /* onclose follows */
                    };
                }

                function disconnectStateSocket() {
                    if (stateSocketTimer) {
                        clearTimeout(stateSocketTimer);
                        stateSocketTimer = null;
                    }
                    if (stateSocket) {
                        var socket = stateSocket;
                        stateSocket = null;
                        socket.onclose = null;
                        socket.onmessage = null;
                        socket.onerror = null;
                        try {
                            socket.close();
                        } catch (error) {
                            /* ignore */
                        }
                    }
                }

                function scheduleStateReconnect() {
                    if (!needsStateSocket()) return;
                    if (stateSocketTimer) return;
                    stateRetry++;
                    stateSocketTimer = setTimeout(function () {
                        stateSocketTimer = null;
                        connectStateSocket();
                    }, Math.min(10000, 500 * stateRetry));
                }

                function scheduleGameReconnect() {
                    if (view.inputMode === 'keyboard') return;
                    if (gameSocketTimer) return;

                    gameSocketRetry++;
                    var delay = Math.min(5000, 400 * gameSocketRetry);
                    gameSocketTimer = setTimeout(function () {
                        gameSocketTimer = null;
                        if (activeSource === GAME_SOURCE || view.inputMode === 'game') {
                            connectGameSocket();
                        }
                    }, delay);
                }

                function disconnectGameSocket() {
                    if (gameSocketTimer) {
                        clearTimeout(gameSocketTimer);
                        gameSocketTimer = null;
                    }
                    if (gameSocket) {
                        var socket = gameSocket;
                        gameSocket = null;
                        socket.onclose = null;
                        socket.onmessage = null;
                        socket.onerror = null;
                        try {
                            socket.close();
                        } catch (error) {
                            /* ignore */
                        }
                    }
                    releaseSource(GAME_SOURCE);
                    updateStatus();
                }

                /* ---- keyboard source ---- */
                function bindInput() {
                    window.addEventListener(
                        'keydown',
                        function (event) {
                            keyboardSeen = true;
                            if (view.inputMode === 'game') return;
                            if (activeSource !== KEYBOARD_SOURCE) setActiveSource(KEYBOARD_SOURCE);

                            var handled = setPressed(event.code, true);
                            if (handled && event.preventDefault) event.preventDefault();
                        },
                        true
                    );

                    window.addEventListener(
                        'keyup',
                        function (event) {
                            var handled = setPressed(event.code, false);
                            if (handled && event.preventDefault) event.preventDefault();
                        },
                        true
                    );

                    /* a key held while the overlay or the game takes focus never
                       sends keyup: drop everything on blur or tab switch */
                    window.addEventListener('blur', function () {
                        releaseSource(KEYBOARD_SOURCE);
                    });
                    document.addEventListener('visibilitychange', function () {
                        if (document.hidden) releaseSource(KEYBOARD_SOURCE);
                    });

                    /* simulate input with ?press=KeyZ,Space for previews and tests */
                    var params = new URLSearchParams(window.location.search || '');
                    var pressParam = params.get('press');
                    if (pressParam) {
                        var codes = pressParam.split(',');
                        for (var i = 0; i < codes.length; i++) {
                            var code = resolveCode(codes[i].trim());
                            if (code) setPressed(code, true);
                        }
                    }

                    /* ?auto=1 lets the fake tosu socket in tools/serve.js drive the
                       overlay, which is how the data path gets screenshot tested */
                    if (params.get('auto') === '1' && typeof window.WebSocket === 'function') {
                        keyboardSeen = true;
                        keyboardProbeDone = true;
                    }
                }

                function startInput() {
                    if (statusEl) statusEl.style.display = 'none';

                    if (view.inputMode === 'game') {
                        keyboardProbeDone = true;
                        setActiveSource(GAME_SOURCE);
                        connectGameSocket();
                        updateStatus();
                        return;
                    }
                    /* keyboard mode: never touch the socket */
                    if (view.inputMode === 'keyboard') {
                        keyboardProbeDone = true;
                        disconnectGameSocket();
                        activeSource = KEYBOARD_SOURCE;
                        updateStatus();
                        return;
                    }

                    /* auto: assume the keyboard works, and hand over to the tosu
                       data if nothing arrives before the probe expires */
                    if (!keyboardSeen) {
                        if (probeTimer) clearTimeout(probeTimer);
                        probeTimer = setTimeout(probeKeyboard, view.inputProbeMs);
                    }
                    updateStatus();
                }

                /* Safety net: the overlay must never sit idle just because the
                   settings file was slow or unreachable. If nothing has started the
                   input machinery a few seconds in, start it with whatever the
                   current settings (or the built-in defaults) say. */
                function ensureInputStarted() {
                    if (inputStarted) return false;
                    if (settingsSource === 'defaults') {
                        log('settings.json did not arrive, starting input anyway');
                    }
                    startInput();
                    inputStarted = true;
                    return true;
                }

                /* ------------------------------------------------------------------ *
                 * 10. Settings: initial read + polling
                 * ------------------------------------------------------------------ */

                /* NOTE: no `dashboardValues` parameter here. It used to take one, which
                   shadowed the module-level set and silently made every call that
                   omitted the argument read `undefined` - so a settings broadcast
                   parsed correctly, merged correctly, and then changed nothing. Read
                   the module-level set directly instead. */
                function normalize(input) {
                    var out = {};
                    var prop;

                    /* Two shapes arrive here:
                       - settings.json: an ARRAY of setting definitions, whose `value`
                         fields are the defaults
                       - <tosu>/settings/<folder>.values.json (and whatever the
                         Dashboard sends): a plain OBJECT keyed by uniqueID
                       Both are turned into one flat "source" object first. */
                    var source = {};
                    if (Array.isArray(input)) {
                        for (var i = 0; i < input.length; i++) {
                            var entry = input[i];
                            if (!entry || typeof entry !== 'object') continue;
                            if (entry.value === undefined) continue;
                            source[entry.uniqueID] = entry.value;
                        }
                    } else if (input && typeof input === 'object') {
                        source = input;
                    }

                    /* ?config={"keyCount":6,...} in the overlay URL forces values on
                       top of whatever settings.json says. It is applied here on the
                       flat source, which:
                         - keeps an ARRAY settings.json intact (merging onto the raw
                           array would turn it into an object and drop the defaults)
                         - lets the URL win even for keys the file also defines */
                    var override = currentUrlOverride();

                    /* One pass over the known settings. Precedence, highest first:
                       URL override -> Dashboard values -> what we already had ->
                       settings.json -> built-in default. Every value is coerced by
                       type in place, so there is no way for a later pass to silently
                       overwrite an earlier decision. */
                    for (prop in DEFAULTS) {
                        if (!Object.prototype.hasOwnProperty.call(DEFAULTS, prop)) continue;

                        var chosen = DEFAULTS[prop];
                        var haveValue = false;

                        /* Locked settings are no longer in settings.json, so
                           nothing in the Dashboard can change them. Any value
                           left over in an old values file or a stale broadcast
                           must NOT be read back either, or the value would
                           silently revert the moment the file is re-read.
                           An explicit ?config= still wins: the features are all
                           still implemented and still reachable that way. */
                        if (
                            LOCKED_SETTINGS.indexOf(prop) !== -1 &&
                            !(
                                override &&
                                Object.prototype.hasOwnProperty.call(override, prop) &&
                                override[prop] !== undefined &&
                                override[prop] !== null
                            )
                        ) {
                            out[prop] = DEFAULTS[prop];
                            continue;
                        }

                        /* the previously applied value: the safety layer that stops a
                           partial Dashboard update from resetting everything else */
                        if (
                            lastGoodSettings &&
                            Object.prototype.hasOwnProperty.call(lastGoodSettings, prop) &&
                            lastGoodSettings[prop] !== undefined &&
                            lastGoodSettings[prop] !== null
                        ) {
                            chosen = lastGoodSettings[prop];
                            haveValue = true;
                        }

                        if (Object.prototype.hasOwnProperty.call(source, prop)) {
                            var fromSource = source[prop];
                            if (fromSource !== undefined && fromSource !== null) {
                                chosen = fromSource;
                                haveValue = true;
                            }
                        }

                        if (
                            dashboardValues &&
                            Object.prototype.hasOwnProperty.call(dashboardValues, prop)
                        ) {
                            var fromDashboard = dashboardValues[prop];
                            if (fromDashboard !== undefined && fromDashboard !== null) {
                                chosen = fromDashboard;
                                haveValue = true;
                            }
                        }

                        if (override && Object.prototype.hasOwnProperty.call(override, prop)) {
                            var fromUrl = override[prop];
                            if (fromUrl !== undefined && fromUrl !== null) {
                                chosen = fromUrl;
                                haveValue = true;
                            }
                        }

                        if (!haveValue) {
                            out[prop] = DEFAULTS[prop];
                            continue;
                        }

                        if (NUMERIC_LIMITS[prop]) {
                            out[prop] = coerceNumber(prop, chosen, DEFAULTS[prop]);
                        } else if (BOOLEAN_KEYS.indexOf(prop) !== -1) {
                            out[prop] = coerceBool(chosen);
                        } else {
                            out[prop] = chosen;
                        }
                    }

                    if (['bar', 'blocks'].indexOf(out.rainMode) === -1) {
                        out.rainMode = DEFAULTS.rainMode;
                    }
                    if (['auto', 'keyboard', 'game'].indexOf(out.inputMode) === -1) {
                        out.inputMode = DEFAULTS.inputMode;
                    }
                    if (['general', 'precise'].indexOf(out.gameSocket) === -1) {
                        out.gameSocket = DEFAULTS.gameSocket;
                    }

                    out.debugStatus = coerceBool(out.debugStatus);
                    return out;
                }

                function signatureOf(value) {
                    return JSON.stringify(value);
                }

                var currentSignature = null;
                var settingsLoaded = false;
                var lastSettingsError = 'not requested';
                var lastSettingsUrl = '';
                var settingsSource = 'defaults';
                var settingsFetchState = 'idle';
                var settingsFetchCount = 0;
                var lastInputSignature = null;

                function applySettings(input) {
                    var next = normalize(input);
                    var signature = signatureOf(next);
                    if (signature === currentSignature) return;

                    var previousSlots = settings ? settings.gameSlots : undefined;
                    var previousDisplay = settings ? settings.displayText : undefined;
                    currentSignature = signature;
                    settings = next;
                    view = next;
                    settingsLoaded = true;
                    /* remember the fully resolved set: a later partial Dashboard
                       update falls back to this instead of the plugin defaults */
                    lastGoodSettings = next;

                    showDebug =
                        new URLSearchParams(window.location.search || '').has('debug') ||
                        next.debugStatus === true;
                    if (debugEl) {
                        debugEl.style.display = showDebug ? 'block' : 'none';
                    }

                    log('settings applied', next);
                    /* the squares were re-created, so rain belonging to the previous
                       mapping would keep falling in the wrong column */
                    if (
                        rain.length &&
                        keys.length &&
                        (previousSlots !== next.gameSlots ||
                            previousDisplay !== next.displayText)
                    ) {
                        resetRain();
                    }

                    /* an input related change needs the source machinery restarted */
                    var inputSignature =
